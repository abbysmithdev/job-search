name: Refresh job listings

on:
  schedule:
    - cron: '17 12 * * *'   # every day around 7am Central
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: job-watch           # shared with the weekly company discovery so the two never collide
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch listings
        run: node scripts/fetch-jobs.mjs
        env:
          RESUME_PROFILE: ${{ secrets.RESUME_PROFILE }}
      - name: Score matches
        run: node scripts/score-jobs.mjs
        continue-on-error: true   # a scoring problem should never block the listings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESUME_PROFILE: ${{ secrets.RESUME_PROFILE }}
      - name: Save jobs.json
        run: |
          git config user.name "job-watch bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.json descriptions.json skip.json
          git diff --cached --quiet || (git commit -m "Refresh job listings" && git pull --rebase && git push)
