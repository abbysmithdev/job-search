name: Refresh job listings

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch listings
        run: node scripts/fetch-jobs.mjs
      - name: Save jobs.json
        run: |
          git config user.name "job-watch bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || (git commit -m "Refresh job listings" && git push)
