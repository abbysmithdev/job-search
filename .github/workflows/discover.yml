name: Discover companies

on:
  schedule:
    - cron: '41 13 * * 1'   # every Monday morning
  workflow_dispatch:         # also run when you apply decisions from the Config page
    inputs:
      decisions:
        description: 'Decisions from the Config page (filled in by the app)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: job-watch
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find companies
        run: node scripts/discover.mjs
        env:
          DECISIONS: ${{ inputs.decisions }}
      - name: Save pool.json
        run: |
          git config user.name "job-watch bot"
          git config user.email "actions@users.noreply.github.com"
          git add pool.json
          git diff --cached --quiet || (git commit -m "Update company pool" && git pull --rebase && git push)
      - name: Refresh listings so new companies show up
        run: gh workflow run refresh.yml
        env:
          GH_TOKEN: ${{ github.token }}
